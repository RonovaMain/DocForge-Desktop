name: Linux Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 22.04: собранная программа запустится и на более старых дистрибутивах (меньше требований к glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: System libraries for Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libdbus-1-3 libfontconfig1 binutils

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build document engine (Java + trimmed JRE)
        run: python tools/build_engine.py

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      # Драйверы печати foo2zjs и родственные (GPL). Шаг не обязательный: не собрались — программа выйдет без них
      - name: Build printer filters (foo2zjs family)
        continue-on-error: true
        run: bash tools/build_filters.sh

      - name: Package with PyInstaller
        run: pyinstaller packaging/docforge.spec --noconfirm

      - name: Self-test of the built program
        run: |
          dist/DocForge/DocForge --selftest "$PWD/selftest.txt"
          cat selftest.txt

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import docforge; print(docforge.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Make portable tar.gz and .run installer
        run: sh packaging/linux/make-run.sh "${{ steps.ver.outputs.version }}" output

      - uses: actions/upload-artifact@v4
        with:
          name: DocForge-Linux
          path: |
            output/DocForge-*.tar.gz
            output/DocForge-*.run

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/DocForge-*.tar.gz
            output/DocForge-*.run
